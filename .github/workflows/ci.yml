name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 development headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxi-dev libxcb1-dev \
            x11proto-dev libxext-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      # The tool must at least start and describe itself on every platform.
      # A permission gate is expected on macOS, so --dry-run is used: it parses
      # the sequence and prints it without touching the OS.
      - name: Smoke test (dry run)
        run: cargo run --release -- --actions "(1,1,click)*2" --dry-run --start-delay 0 --count 1

      - name: Every key name parses
        run: cargo run --release -- --list-keys

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The window vendors GPUI Community Edition, which needs its own platform
      # libraries on top of the X11 headers clickloop itself wants.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xinput-dev libegl1-mesa-dev libgles2-mesa-dev \
            libglib2.0-dev libfontconfig-dev libxtst-dev libxi-dev \
            libxcb1-dev x11proto-dev libxext-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # GPUI Community Edition requires 1.95 or newer.
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Build the window
        working-directory: gui
        run: cargo build --release

  fmt:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install X11 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxi-dev libxcb1-dev \
            x11proto-dev libxext-dev pkg-config
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
