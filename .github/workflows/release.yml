name: release

# Builds a binary for each supported platform and attaches it to a release.
# Triggered by pushing a tag such as v1.0.0, or by running it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: clickloop-macos-arm64
          # Intel Mac
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: clickloop-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: clickloop-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: clickloop-windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install X11 development headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxi-dev libxcb1-dev \
            libxproto-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/clickloop" dist/
          cp README.md dist/
          tar -czf "$ARCHIVE.tar.gz" -C dist .
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/$env:TARGET/release/clickloop.exe" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$env:ARCHIVE.zip"
          (Get-FileHash "$env:ARCHIVE.zip" -Algorithm SHA256).Hash.ToLower() +
            "  $env:ARCHIVE.zip" | Out-File "$env:ARCHIVE.zip.sha256"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: List
        run: ls -la artefacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          generate_release_notes: true
